networks:
  blinko-network:
    driver: bridge

services:
  blinko-website:
    image: ghcr.io/lyizhuo/blinko:latest
    environment:
      NODE_ENV: production
      NEXTAUTH_URL: https://${DOMAIN}
      NEXT_PUBLIC_BASE_URL: https://${DOMAIN}
      NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
      DATABASE_URL: ${DATABASE_URL}
    volumes:
      - blinko-data:/app/.blinko
    restart: always
    logging:
      options:
        max-size: "10m"
        max-file: "3"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:1111/"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - blinko-network

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    environment:
      DOMAIN: ${DOMAIN}
    restart: always
    depends_on:
      blinko-website:
        condition: service_started
    networks:
      - blinko-network

volumes:
  blinko-data:
  caddy-data:
  caddy-config:
